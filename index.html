        function renderForm() {

                        </div>

                    </form>

            `;

        function renderQuestion() {
            const q = questions[appState.currentQuestion];
            const progress = Math.round(((appState.currentQuestion + 1) / questions.length) * 100);
            
            let html = `
                <div class="progress-container">
                    <div class="progress-info">
                        <span>Pregunta ${appState.currentQuestion + 1} de 16</span>
                        <span>${progress}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%;"></div>
                    </div>
                </div>
                
                <div class="question-box">
                    <h2>${q.question}</h2>
                </div>
                
                <div style="margin-bottom: 2rem;">
            `;
            
            q.options.forEach((option, idx) => {
                html += `<button class="btn-option" onclick="selectOption(${idx})">${option}</button>`;
            });
            
            html += `</div>`;
            
            if (appState.currentQuestion > 0) {
                html += `<button class="btn-secondary" onclick="previousQuestion()">← Pregunta Anterior</button>`;
            }
            
            html += `</div>`;
            return html;
        }

        function calculateScores() {
            const scores = {};
            const categoryMap = {};
            
            questions.forEach(q => {
                if (!categoryMap[q.category]) categoryMap[q.category] = [];
                categoryMap[q.category].push(q);
            });
            
            Object.keys(categoryMap).forEach(cat => {
                scores[cat] = 0;
            });
            
            questions.forEach(q => {
                const value = appState.responses[q.id] || 0;
                const categoryScore = (value / 3) * 100;
                scores[q.category] += categoryScore / categoryMap[q.category].length;
            });
            
            return scores;
        }

        function getRecommendations() {
            const scores = calculateScores();
            const courseScores = {};
            
            // Mapear cada curso a su inteligencia
            Object.entries(courses).forEach(([courseId, course]) => {
                const score = scores[course.intelligence] || 0;
                courseScores[courseId] = score;
            });
            
            return Object.entries(courseScores)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 3)
                .map(([id,]) => parseInt(id));
        }

        async function sendToSheet(recommendations) {
            const topScores = Object.entries(calculateScores())
                .sort(([,a], [,b]) => b - a)
                .slice(0, 1)
                .map(([k]) => k)[0];
            
            const data = {
                nombre: appState.leadData.nombre,
                email: appState.leadData.email,
                telefono: appState.leadData.telefono,
                organizacion: appState.leadData.organizacion,
                resultadoPrincipal: topScores,
                cursosRecomendados: recommendations.map(id => courses[id].title).join(' | ')
            };
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                return response.ok;
            } catch (error) {
                console.log('Datos guardados localmente:', data);
                return true;
            }
        }

        function renderResults() {
            const recommendations = getRecommendations();
            const scores = calculateScores();
            
            const topDomains = Object.entries(scores)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 3)
                .map(([k, v]) => ({ domain: k, score: Math.round(v) }));
            
            // Encontrar la inteligencia más baja para el curso reto
            const lowestIntelligence = Object.entries(scores)
                .sort(([,a], [,b]) => a - b)[0];
            
            // Encontrar un curso que tenga esa inteligencia baja como su inteligencia principal
            const challengeCourse = Object.entries(courses).find(
                ([_, course]) => course.intelligence === lowestIntelligence[0]
            );
            
            const challengeCourseId = challengeCourse ? parseInt(challengeCourse[0]) : null;
            
            const matchReasons = {
                1: 'Tu apreciación por la música te permite vivir experiencias emocionales profundas y conectar con tu bienestar integral.',
                2: 'Tu capacidad lógica es perfecta para estructurar decisiones financieras complejas y proteger el patrimonio familiar.',
                3: 'Tu pensamiento estratégico te permite planificar herencias de manera ordenada y legal.',
                4: 'Tu habilidad comunicativa te permite expresar ideas con impacto y confianza profesional.',
                5: 'Tu autoconocimiento es esencial para reimaginarte con propósito después de la jubilación.',
                6: 'Tu interés en la naturaleza y sostenibilidad se alinea perfectamente con una nutrición consciente y saludable.',
                7: 'Tu compromiso con la salud integral te permite fortalecer mente y cuerpo simultáneamente.',
                8: 'Tu conexión con la naturaleza y las culturas te permite vivir experiencias culinarias enriquecedoras.',
                9: 'Tu capacidad lógica te permite dominar herramientas digitales de forma segura y funcional.',
                10: 'Tu talento interpersonal es perfecto para estructurar servicios de consultoría con impacto social.',
                11: 'Tu capacidad espacial y visual te permite apreciar profundamente la historia del arte.',
                12: 'Tu razonamiento matemático es esencial para una planificación financiera consciente y efectiva.',
                13: 'Tu liderazgo interpersonal te permite crear proyectos de filantropía con impacto duradero.',
                14: 'Tu lógica y pensamiento analítico te permite usar IA de forma estratégica y productiva.',
                15: 'Tu capacidad emprendedora combinada con tu experiencia te permite crear proyectos viables y significativos.',
                16: 'Tu introspección y reflexión personal te permite navegar el duelo con sabiduría y resiliencia.'
            };
            
            const challengeReasons = {
                'inteligencia_musical': 'Aunque la música no es tu fortaleza natural, desarrollarla te abre puertas a experiencias emocionales profundas y sanación que complementan tu vida. La música fortalece áreas del cerebro que mejoran memoria, concentración y bienestar general.',
                'inteligencia_logica': 'Aunque el pensamiento lógico no es tu punto fuerte, fortalecerlo te dará seguridad en decisiones financieras y planificación, competencias cruciales para tu etapa. La lógica estructura el pensamiento y reduce ansiedad.',
                'inteligencia_espacial': 'Aunque la visualización espacial no es tu fortaleza, desarrollarla te permite apreciar el mundo con nueva perspectiva y estimula creatividad. Amplía tu comprensión de la belleza y la composición en la vida.',
                'inteligencia_linguistica': 'Aunque la comunicación verbal no es tu fortaleza natural, desarrollarla te empodera para expresar tus ideas con confianza. Es una habilidad fundamental en cualquier contexto social y profesional.',
                'inteligencia_corporal': 'Aunque el movimiento no es tu fortaleza principal, desarrollarlo mejora tu salud, energía y conciencia corporal. Es especialmente importante para prevenir pérdida de capacidades en la madurez.',
                'inteligencia_naturalista': 'Aunque tu conexión con la naturaleza no es lo primordial, fortalecerla te conecta con sostenibilidad y autocuidado. Abre perspectivas sobre cómo vivir en armonía con tu entorno.',
                'inteligencia_interpersonal': 'Aunque trabajar con otros no es tu zona de confort, desarrollarlo expande tu red, genera impacto y combate aislamiento. Las relaciones significativas son clave para bienestar en la madurez.',
                'inteligencia_intrapersonal': 'Aunque la reflexión interna no es tu fuerte, desarrollarla te da claridad sobre quién eres y qué te importa. Es la base para decisiones auténticas y vida con propósito.'
            };
            
            let html = `
                <div class="results-header">
                    <h1>Tu Perfil de Aptitudes</h1>
                    <p style="color: #666; font-size: 14px; margin-top: 0.5rem;">Basado en tu evaluación personalizada</p>
                </div>
                
                <div class="header-section">
                    <h3>Tus Fortalezas Principales</h3>
            `;
            
            topDomains.forEach(d => {
                const explanation = intelligenceExplanations[d.domain] || '';
                html += `
                    <div class="strength-item">
                        <div class="strength-label">
                            <span>${d.domain.replace(/_/g, ' ').toUpperCase()}</span>
                            <span>${d.score}%</span>
                        </div>
                        <div class="strength-bar">
                            <div class="strength-fill" style="width: ${d.score}%;"></div>
                        </div>
                        <p style="font-size: 12px; color: #666; margin-top: 0.5rem; font-style: italic;">${explanation}</p>
                    </div>
                `;
            });
            
            html += `</div><div style="margin-top: 2rem;"><h3 style="color: #003d82; font-weight: 600; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 0.5px;">✨ Cursos Recomendados para Ti</h3>`;
            
            recommendations.forEach((courseId, idx) => {
                const course = courses[courseId];
                const reason = matchReasons[courseId] || 'Curso personalizado para ti.';
                html += `
                    <div class="course-card">
                        <div class="course-number">${idx + 1}</div>
                        <h4>${course.title}</h4>
                        <p><strong style="color: #003d82;">¿Por qué es perfecto para ti?</strong> ${reason}</p>
                        <p style="margin-top: 0.75rem;">${course.desc}</p>
                        <span class="course-type">${course.type}</span>
                    </div>
                `;
            });
            
            if (challengeCourseId && challengeCourseId !== recommendations[0] && challengeCourseId !== recommendations[1] && challengeCourseId !== recommendations[2]) {
                const challengeCourse = courses[challengeCourseId];
                const challengeReason = challengeReasons[lowestIntelligence[0]] || 'Desarrolla nuevas competencias.';
                
                html += `
                    <div style="margin-top: 2rem; padding-top: 2rem; border-top: 2px solid #e0e0e0;">
                        <h3 style="color: #003d82; font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px;">🚀 Tu Curso Reto: Amplía tus Horizontes</h3>
                        <p style="color: #666; font-size: 13px; margin-bottom: 1.5rem; font-style: italic;">Este curso te invita a desarrollar una competencia complementaria que fortalecerá tu crecimiento integral.</p>
                        <div class="course-card" style="border-left-color: #ff9800; background-color: #fff8f0;">
                            <div class="course-number" style="background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);">🎯</div>
                            <h4>${challengeCourse.title}</h4>
                            <p><strong style="color: #ff9800;">¿Por qué es un reto positivo?</strong> ${challengeReason}</p>
                            <p style="margin-top: 0.75rem;">${challengeCourse.desc}</p>
                            <span class="course-type" style="background: linear-gradient(135deg, #ffe0b2 0%, #ffcc80 100%); color: #e65100;">${challengeCourse.type}</span>
                        </div>
                    </div>
                `;
            }
            
            html += `
                    </div>
                    <button class="btn-secondary" onclick="location.reload()">Hacer el test nuevamente</button>
                </div>
            `;
            return html;
        }

        function submitForm(e) {
            e.preventDefault();
            appState.leadData = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                organizacion: document.getElementById('organizacion').value
            };
            appState.screen = 'test';
            appState.currentQuestion = 0;
            render();
        }

        function selectOption(idx) {
            const q = questions[appState.currentQuestion];
            appState.responses[q.id] = idx;
            
            if (appState.currentQuestion < questions.length - 1) {
                appState.currentQuestion++;
                render();
                window.scrollTo(0, 0);
            } else {
                finishTest();
            }
        }

        function previousQuestion() {
            if (appState.currentQuestion > 0) {
                appState.currentQuestion--;
                render();
                window.scrollTo(0, 0);
            }
        }

        async function finishTest() {
            appState.loading = true;
            render();
            const recommendations = getRecommendations();
            await sendToSheet(recommendations);
            appState.screen = 'results';
            appState.loading = false;
            render();
            window.scrollTo(0, 0);
        }

        function render() {
            const content = document.getElementById('content');
            let html = '';
            
            if (appState.loading) {
                html = '<div class="loading"><p>Procesando tu evaluación...</p></div>';
            } else if (appState.screen === 'form') {
                html = renderForm();
            } else if (appState.screen === 'test') {
                html = renderQuestion();
            } else if (appState.screen === 'results') {
                html = renderResults();
            }
            
            content.innerHTML = html;
        }

        render();
    </script>
</body>
</html>
